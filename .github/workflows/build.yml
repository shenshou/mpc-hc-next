name: MPC-HC Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpc-hc-windows-build
  cancel-in-progress: true

jobs:
  build:
    name: Build x86 and x64 (Release)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned NASM 2.16.03
        shell: pwsh
        run: |
          $version = '2.16.03'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip"
          $expectedSha256 = '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6'
          $archive = Join-Path $env:RUNNER_TEMP "nasm-$version-win64.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP "nasm-$version"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM archive SHA256 mismatch. Expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory -Force
          $nasmPath = Join-Path $installDirectory "nasm-$version\nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmPath -PathType Leaf)) {
            throw "NASM executable was not found after extraction: $nasmPath"
          }

          $nasmDirectory = Split-Path -Parent $nasmPath
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "NASM_DIRECTORY=$nasmDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NASM_EXE=$nasmPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Pinned NASM executable: $nasmPath"
          & $nasmPath -v
          if ($LASTEXITCODE -ne 0) {
            throw "NASM version check failed with exit code $LASTEXITCODE"
          }

      - name: Set up Python and translation dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python translation dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install polib
          $pythonPath = (Get-Command python.exe -ErrorAction Stop).Source
          $pythonDirectory = Split-Path -Parent $pythonPath
          "MPCHC_PYTHON=$pythonDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Python: $pythonPath"
          python -c "import polib; print('polib:', polib.__version__)"

      - name: Configure Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.ATLMFC Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath -or -not (Test-Path (Join-Path $vsPath 'Common7\Tools\vsdevcmd.bat'))) {
            throw 'A Visual Studio installation with MSBuild, ATL/MFC and x86/x64 C++ tools was not found.'
          }

          $sdkRoot = Join-Path $programFilesX86 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "No Windows 10/11 SDK installation was found under $sdkRoot"
          }

          @(
            '@ECHO OFF'
            ('SET "MPCHC_VS_PATH=' + $vsPath + '"')
            ('SET "MPCHC_WINSDK_VER=' + $sdk.Name + '"')
            ('SET "MPCHC_PYTHON=' + $env:MPCHC_PYTHON + '"')
            ('SET "PATH=' + $env:NASM_DIRECTORY + ';%PATH%"')
          ) | Set-Content -Path build.user.bat -Encoding ASCII

          "MPCHC_VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MPCHC_WINSDK_VER=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Visual Studio: $vsPath"
          Write-Host "Windows SDK: $($sdk.Name)"

      - name: Patch LAVFilters NASM invocation paths
        shell: pwsh
        run: |
          # MSBuild imports environment variables as properties. Use the verified,
          # pinned executable directly so nested MSBuild nodes do not depend on PATH.
          $projectPatches = @(
            @{
              Path = 'src/thirdparty/LAVFilters/msvc/libs/dav1d/dav1d.vcxproj'
              Pattern = '(<Command>)nasm(?=\s)'
              Label = 'dav1d custom-build commands'
            },
            @{
              Path = 'src/thirdparty/LAVFilters/msvc/ffmpeg/ffmpeg.props'
              Pattern = '(<Exec Command=")nasm(?=\s)'
              Label = 'FFmpeg Exec command'
            }
          )

          foreach ($item in $projectPatches) {
            $source = Get-Content -LiteralPath $item.Path -Raw
            $regex = [regex]::new($item.Pattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            $matches = $regex.Matches($source)
            if ($matches.Count -eq 0) {
              throw "No NASM command was found to patch in $($item.Path)"
            }
            $patched = $regex.Replace($source, [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              $match.Groups[1].Value + '&quot;$(NASM_EXE)&quot;'
            })
            Set-Content -LiteralPath $item.Path -Value $patched -Encoding Ascii -NoNewline
            Write-Host "Patched $($matches.Count) NASM invocation(s) in $($item.Path) ($($item.Label))."
          }

          # The batch wrapper performs an initial PATH-based dependency check.
          # Keep NASM on PATH there; actual MSBuild assembly commands use NASM_EXE.
          $scriptPath = 'src/thirdparty/LAVFilters/build_lavfilters.bat'
          $content = Get-Content -LiteralPath $scriptPath -Raw
          $anchor = 'CALL "%TOOLSET%" -no_logo -arch=%TOOLSETARCH%'
          $patch = @'
          CALL "%TOOLSET%" -no_logo -arch=%TOOLSETARCH%
          IF DEFINED NASM_DIRECTORY SET "PATH=%NASM_DIRECTORY%;%PATH%"
          where.exe nasm.exe
          IF ERRORLEVEL 1 EXIT /B 1
          nasm.exe -v
          IF ERRORLEVEL 1 EXIT /B 1
          '@
          if (-not $content.Contains($anchor)) {
            throw "Could not find the expected Visual Studio environment initialization in $scriptPath"
          }
          if ($content.Contains('IF DEFINED NASM_DIRECTORY SET "PATH=%NASM_DIRECTORY%;%PATH%"')) {
            throw 'The NASM PATH patch is already present; refusing to apply it twice.'
          }
          $content = $content.Replace($anchor, $patch.TrimEnd())

          # Keep PATH validation immediately before both nested MSBuild invocations.
          $msbuildAnchors = @(
            '  MSBuild.exe msvc\ffmpeg\avfilter.vcxproj'
            'MSBuild.exe LAVFilters.sln'
          )
          foreach ($msbuildAnchor in $msbuildAnchors) {
            if (-not $content.Contains($msbuildAnchor)) {
              throw "Could not find expected MSBuild command: $msbuildAnchor"
            }
            $guard = @'
          IF DEFINED NASM_DIRECTORY SET "PATH=%NASM_DIRECTORY%;%PATH%"
          where.exe nasm.exe
          IF ERRORLEVEL 1 EXIT /B 1
          nasm.exe -v
          IF ERRORLEVEL 1 EXIT /B 1
          '@
            $content = $content.Replace($msbuildAnchor, $guard.TrimEnd() + "`r`n" + $msbuildAnchor)
          }
          Set-Content -LiteralPath $scriptPath -Value $content -Encoding Ascii -NoNewline
          Write-Host "Patched $scriptPath for PATH-based preflight checks."

      - name: Build MPC-HC
        shell: cmd
        run: |
          where.exe nasm.exe
          nasm.exe -v
          build.bat Build Both MPCHC Release Silent Nocolors

      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-windows-build
          path: |
            bin/mpc-hc_x86/**
            bin/mpc-hc_x64/**
            bin/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: pwsh
        run: |
          '## MPC-HC Windows build' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Source commit: ${{ github.sha }}' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Runner: windows-2022' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Target: x86 + x64 / Release' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- No GitHub Release is created by this workflow.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

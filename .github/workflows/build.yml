name: MPC-HC Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'MPC-HC-Next.*'

permissions:
  contents: write

concurrency:
  group: mpc-hc-windows-build
  cancel-in-progress: true

jobs:
  build:
    name: Build x86 and x64 (Release)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned NASM 2.16.03
        shell: pwsh
        run: |
          $version = '2.16.03'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip"
          $expectedSha256 = '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6'
          $archive = Join-Path $env:RUNNER_TEMP "nasm-$version-win64.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP "nasm-$version"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM archive SHA256 mismatch. Expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory -Force
          $nasmPath = Join-Path $installDirectory "nasm-$version\nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmPath -PathType Leaf)) {
            throw "NASM executable was not found after extraction: $nasmPath"
          }

          $nasmDirectory = Split-Path -Parent $nasmPath
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "NASM_DIRECTORY=$nasmDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NASM_EXE=$nasmPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Pinned NASM executable: $nasmPath"
          & $nasmPath -v
          if ($LASTEXITCODE -ne 0) {
            throw "NASM version check failed with exit code $LASTEXITCODE"
          }

      - name: Install packaging tools (7-Zip and Inno Setup)
        shell: pwsh
        run: |
          # Match the upstream build script's 7-Zip PATH/registry discovery and
          # Inno Setup 6 registry discovery. Validate the exact executables here.
          choco install 7zip innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey packaging-tool installation failed with exit code $LASTEXITCODE"
          }

          $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($sevenZipCommand) {
            $sevenZipPath = $sevenZipCommand.Source
          }
          else {
            $candidate = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "7z.exe was not found after installing 7-Zip. Checked PATH and $candidate"
            }
            $sevenZipPath = $candidate
            $sevenZipDirectory = Split-Path -Parent $sevenZipPath
            $env:PATH = "$sevenZipDirectory;$env:PATH"
            $sevenZipDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          & $sevenZipPath i | Select-Object -First 2
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip validation failed with exit code $LASTEXITCODE"
          }

          $innoKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          if (-not (Test-Path -LiteralPath $innoKey)) {
            $innoKey = 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          }
          if (-not (Test-Path -LiteralPath $innoKey)) {
            throw 'Inno Setup 6 registry entry was not found after installation.'
          }

          $innoDirectory = (Get-ItemProperty -LiteralPath $innoKey).'Inno Setup: App Path'
          $iscc = Join-Path $innoDirectory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler was not found: $iscc"
          }

          # ISCC /? prints help but returns exit code 1 on this runner.
          # The executable's existence is the appropriate pre-build check;
          # its real compilation result is checked when build.bat runs Packages.
          $isccVersion = (Get-Item -LiteralPath $iscc).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($isccVersion)) {
            throw "Could not read Inno Setup compiler version from $iscc"
          }
          Write-Host "Inno Setup compiler version: $isccVersion"

          "SEVENZIP=$sevenZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "7-Zip: $sevenZipPath"
          Write-Host "Inno Setup: $iscc"

      - name: Set up Python and translation dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python translation dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install polib
          $pythonPath = (Get-Command python.exe -ErrorAction Stop).Source
          $pythonDirectory = Split-Path -Parent $pythonPath
          "MPCHC_PYTHON=$pythonDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Python: $pythonPath"
          python -c "import polib; print('polib:', polib.__version__)"

      - name: Configure Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.ATLMFC Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath -or -not (Test-Path (Join-Path $vsPath 'Common7\Tools\vsdevcmd.bat'))) {
            throw 'A Visual Studio installation with MSBuild, ATL/MFC and x86/x64 C++ tools was not found.'
          }

          $sdkRoot = Join-Path $programFilesX86 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "No Windows 10/11 SDK installation was found under $sdkRoot"
          }

          # Preserve the runner's pre-Visual-Studio PATH. The build scripts invoke
          # vsdevcmd from nested batch files; reusing an already-expanded VS PATH
          # can duplicate entries until cmd.exe truncates or rejects commands.
          "MPCHC_BASE_PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @(
            '@ECHO OFF'
            ('SET "MPCHC_VS_PATH=' + $vsPath + '"')
            ('SET "MPCHC_WINSDK_VER=' + $sdk.Name + '"')
            ('SET "MPCHC_PYTHON=' + $env:MPCHC_PYTHON + '"')
            ('SET "PATH=' + $env:NASM_DIRECTORY + ';%PATH%"')
          ) | Set-Content -Path build.user.bat -Encoding ASCII

          "MPCHC_VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MPCHC_WINSDK_VER=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Visual Studio: $vsPath"
          Write-Host "Windows SDK: $($sdk.Name)"

      - name: Patch LAVFilters NASM invocation paths
        shell: pwsh
        run: |
          # MSBuild imports environment variables as properties. Use the verified,
          # pinned executable directly so nested MSBuild nodes do not depend on PATH.
          $projectPatches = @(
            @{
              Path = 'src/thirdparty/LAVFilters/msvc/libs/dav1d/dav1d.vcxproj'
              Pattern = '(<Command>)nasm(?=\s)'
              Label = 'dav1d custom-build commands'
            },
            @{
              Path = 'src/thirdparty/LAVFilters/msvc/ffmpeg/ffmpeg.props'
              Pattern = '(<Exec Command=")nasm(?=\s)'
              Label = 'FFmpeg Exec command'
            }
          )

          foreach ($item in $projectPatches) {
            $source = Get-Content -LiteralPath $item.Path -Raw
            $regex = [regex]::new($item.Pattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            $matches = $regex.Matches($source)
            if ($matches.Count -eq 0) {
              throw "No NASM command was found to patch in $($item.Path)"
            }
            $patched = $regex.Replace($source, [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              $match.Groups[1].Value + '&quot;$(NASM_EXE)&quot;'
            })
            Set-Content -LiteralPath $item.Path -Value $patched -Encoding Ascii -NoNewline
            Write-Host "Patched $($matches.Count) NASM invocation(s) in $($item.Path) ($($item.Label))."
          }

          # build_lavfilters.bat still performs a PATH-based NASM preflight check.
          # Restore standard Windows command directories as well as pinned NASM
          # after vsdevcmd, without expanding PATH inside nested parenthesized blocks.
          $scriptPath = 'src/thirdparty/LAVFilters/build_lavfilters.bat'
          $content = Get-Content -LiteralPath $scriptPath -Raw
          $anchor = 'CALL "%TOOLSET%" -no_logo -arch=%TOOLSETARCH%'
          $patch = @'
          REM Start each nested VS environment from the runner's clean baseline PATH.
          SET "PATH=%MPCHC_BASE_PATH%"
          CALL "%TOOLSET%" -no_logo -arch=%TOOLSETARCH%
          SET "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem;%NASM_DIRECTORY%;%PATH%"
          where.exe xcopy.exe
          IF ERRORLEVEL 1 EXIT /B 1
          where.exe nasm.exe
          IF ERRORLEVEL 1 EXIT /B 1
          nasm.exe -v
          IF ERRORLEVEL 1 EXIT /B 1
          '@
          if (-not $content.Contains($anchor)) {
            throw "Could not find the expected Visual Studio environment initialization in $scriptPath"
          }
          if ($content.Contains('where.exe xcopy.exe')) {
            throw 'The Windows command PATH validation patch is already present; refusing to apply it twice.'
          }
          $content = $content.Replace($anchor, $patch.TrimEnd())
          Set-Content -LiteralPath $scriptPath -Value $content -Encoding Ascii -NoNewline
          Write-Host "Patched $scriptPath to restore Windows system commands and validate xcopy/NASM after Visual Studio setup."

      - name: Prepare MPCVR 0.11.2.2638
        shell: pwsh
        run: |
          # Pin the renderer build that matches MPC-HC 2.8.5. The source commit
          # is ca9ca65 in Aleksoid1978/VideoRenderer; verify the published ZIP
          # before using either architecture's DirectShow filter.
          $version = '0.11.2.2638'
          $url = 'https://github.com/qwerttvv/Player/releases/download/2026.11.05-1209/MpcVideoRenderer-0.11.2.2638_git2026.11.03-ca9ca65.zip'
          $expectedSha256 = 'acafd66d44c243742ca7fa037f27196a32c8193e70f55a9a98d8c300787a529c'
          $archive = Join-Path $env:RUNNER_TEMP 'mpcvr-0.11.2.2638.zip'
          $extractDirectory = Join-Path $env:RUNNER_TEMP 'mpcvr-0.11.2.2638'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "MPCVR archive SHA256 mismatch. Expected $expectedSha256, got $actualSha256"
          }

          if (Test-Path -LiteralPath $extractDirectory) {
            Remove-Item -LiteralPath $extractDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDirectory -Force

          $rendererFiles = @{}
          foreach ($name in @('MpcVideoRenderer.ax', 'MpcVideoRenderer64.ax')) {
            $matches = @(Get-ChildItem -LiteralPath $extractDirectory -Recurse -File -Filter $name)
            if ($matches.Count -ne 1 -or $matches[0].Length -le 0) {
              throw "Expected exactly one non-empty MPCVR file '$name' in the verified archive; found $($matches.Count)."
            }
            $rendererFiles[$name] = $matches[0].FullName
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE 'distrib\mpcvr'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($name in @('MpcVideoRenderer.ax', 'MpcVideoRenderer64.ax')) {
            Copy-Item -LiteralPath $rendererFiles[$name] -Destination (Join-Path $destination $name) -Force
            $file = Get-Item -LiteralPath (Join-Path $destination $name)
            Write-Host "$name prepared ($($file.Length) bytes)"
          }

          Write-Host "Prepared MPC Video Renderer $version from verified archive ($actualSha256)."

      - name: Build MPC-HC
        shell: cmd
        run: |
          where.exe nasm.exe
          nasm.exe -v
          build.bat Build Both MPCHC Release Packages Silent Nocolors
          if errorlevel 1 exit /b %errorlevel%

      - name: Convert upstream portable 7z packages to ZIP
        shell: pwsh
        run: |
          foreach ($arch in @('x86', 'x64')) {
            $source = @(Get-ChildItem -LiteralPath bin -File -Filter "MPC-HC.*.$arch.7z" |
              Where-Object { $_.Name -notlike '*.pdb.7z' })
            if ($source.Count -ne 1) {
              throw "Expected exactly one upstream $arch portable 7z package, found $($source.Count)."
            }

            $baseName = [IO.Path]::GetFileNameWithoutExtension($source[0].Name)
            $stageRoot = Join-Path $env:RUNNER_TEMP "portable-$arch"
            $zipPath = Join-Path (Resolve-Path bin).Path "$baseName.zip"
            if (Test-Path -LiteralPath $stageRoot) {
              Remove-Item -LiteralPath $stageRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $stageRoot | Out-Null

            & 7z.exe x $source[0].FullName "-o$stageRoot" -y
            if ($LASTEXITCODE -ne 0) {
              throw "Could not extract intermediate package: $($source[0].Name)"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $stageRoot $baseName) -PathType Container)) {
              throw "Expected portable package directory was not extracted: $baseName"
            }

            # Upstream build.bat does not copy MPCVR into portable archives.
            # Add the architecture-matched filter beside the player executable.
            $rendererName = if ($arch -eq 'x64') { 'MpcVideoRenderer64.ax' } else { 'MpcVideoRenderer.ax' }
            $rendererSource = Join-Path $env:GITHUB_WORKSPACE "distrib\mpcvr\$rendererName"
            if (-not (Test-Path -LiteralPath $rendererSource -PathType Leaf)) {
              throw "Verified MPCVR source file is missing: $rendererSource"
            }
            $portableRendererDirectory = Join-Path $stageRoot "$baseName\MPCVR"
            New-Item -ItemType Directory -Path $portableRendererDirectory -Force | Out-Null
            Copy-Item -LiteralPath $rendererSource -Destination (Join-Path $portableRendererDirectory $rendererName) -Force
            Write-Host "Added $rendererName to $baseName\MPCVR"

            Push-Location $stageRoot
            try {
              & 7z.exe a -tzip $zipPath $baseName -r
              if ($LASTEXITCODE -ne 0) {
                throw "Could not create ZIP portable package: $baseName.zip"
              }
            }
            finally {
              Pop-Location
            }
            Write-Host "Created $zipPath"
          }

      - name: Set release version and rename packages
        shell: pwsh
        run: |
          # Tag pushes define the release version. Manual CI runs use the current
          # project baseline name without creating a GitHub Release.
          $releasePrefix = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            'MPC-HC-Next.0.1'
          }

          if ($releasePrefix -notmatch '^MPC-HC-Next\.\d+(?:\.\d+)*$') {
            throw "Invalid release tag/name '$releasePrefix'. Expected MPC-HC-Next.<version>."
          }

          foreach ($arch in @('x86', 'x64')) {
            foreach ($extension in @('exe', 'zip')) {
              $sourceFiles = @(Get-ChildItem -LiteralPath bin -File -Filter "MPC-HC.*.$arch.$extension")
              if ($sourceFiles.Count -ne 1) {
                throw "Expected exactly one original $arch $extension package, found $($sourceFiles.Count)."
              }

              $destination = Join-Path (Resolve-Path bin).Path "$releasePrefix.$arch.$extension"
              if (Test-Path -LiteralPath $destination) {
                Remove-Item -LiteralPath $destination -Force
              }
              Move-Item -LiteralPath $sourceFiles[0].FullName -Destination $destination
              Write-Host "Package renamed: $($sourceFiles[0].Name) -> $(Split-Path -Leaf $destination)"
            }
          }

          "RELEASE_PREFIX=$releasePrefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release/package prefix: $releasePrefix"

      - name: Verify x86/x64 portable archives and installers
        shell: pwsh
        run: |
          foreach ($arch in @('x86', 'x64')) {
            foreach ($extension in @('exe', 'zip')) {
              $path = Join-Path (Resolve-Path bin).Path "$env:RELEASE_PREFIX.$arch.$extension"
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Expected package is missing: $path"
              }
              $file = Get-Item -LiteralPath $path
              if ($file.Length -le 0) {
                throw "Package is empty: $path"
              }
              Write-Host "$($file.Name) ($($file.Length) bytes)"
            }
          }

          foreach ($arch in @('x86', 'x64')) {
            $archive = Join-Path (Resolve-Path bin).Path "$env:RELEASE_PREFIX.$arch.zip"
            & 7z.exe t $archive
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip integrity test failed: $(Split-Path -Leaf $archive)"
            }
            $listing = & 7z.exe l -ba $archive
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list portable ZIP: $(Split-Path -Leaf $archive)"
            }
            $expectedExe = if ($arch -eq 'x64') { 'mpc-hc64.exe' } else { 'mpc-hc.exe' }
            if (-not ($listing -match [regex]::Escape($expectedExe))) {
              throw "Portable ZIP for $arch does not contain expected executable $expectedExe"
            }

            $expectedRenderer = if ($arch -eq 'x64') { 'MpcVideoRenderer64.ax' } else { 'MpcVideoRenderer.ax' }
            $rendererPattern = 'MPCVR[\\/]+'
            $rendererPattern += [regex]::Escape($expectedRenderer)
            $listingText = $listing -join [Environment]::NewLine
            if (-not [regex]::IsMatch($listingText, $rendererPattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)) {
              throw "Portable ZIP for $arch does not contain MPCVR\\$expectedRenderer"
            }
          }

      - name: Create GitHub Release with four independent assets
        id: publish_release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            bin/${{ github.ref_name }}.x86.exe
            bin/${{ github.ref_name }}.x86.zip
            bin/${{ github.ref_name }}.x64.exe
            bin/${{ github.ref_name }}.x64.zip

      - name: Upload x86 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}.x86.exe
          path: bin/${{ env.RELEASE_PREFIX }}.x86.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}.x86.zip
          path: bin/${{ env.RELEASE_PREFIX }}.x86.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}.x64.exe
          path: bin/${{ env.RELEASE_PREFIX }}.x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}.x64.zip
          path: bin/${{ env.RELEASE_PREFIX }}.x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-windows-build-logs
          path: bin/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: pwsh
        run: |
          '## MPC-HC Windows build' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Source commit: ${{ github.sha }}' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Runner: windows-2022' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Target: x86 + x64 / Release' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Packages: MPC-HC-Next versioned x86/x64 portable ZIP archives and installers' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ('${{ steps.publish_release.outcome }}' -eq 'success') {
              '- GitHub Release: created with four independent assets.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            else {
              '- GitHub Release: publishing step did not succeed; inspect the Release step logs.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          else {
            '- GitHub Release: not created (manual CI build only; push an MPC-HC-Next.* tag to publish).' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }